<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Countdown Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ตั้งค่าพื้นหลังให้โปร่งใสสำหรับ OBS */
        body {
            background-color: transparent !important;
            overflow: hidden; /* ป้องกันแถบเลื่อน */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'JetBrains Mono', monospace;
        }

        /* สไตล์ของตัวเลขนาฬิกา */
        #timer-display {
            font-size: 8rem; /* ขนาดเริ่มต้น */
            color: #ffffff; /* สีข้อความเริ่มต้น */
            font-weight: 700;
            text-align: center;
            line-height: 1;
            /* เพิ่มเงาให้ตัวหนังสืออ่านง่ายขึ้นเมื่อซ้อนทับภาพใน OBS */
            text-shadow: 
                0px 0px 10px rgba(0, 0, 0, 0.8),
                0px 0px 20px rgba(0, 0, 0, 0.6),
                2px 2px 5px rgba(0, 0, 0, 1);
            user-select: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #timer-display:active {
            transform: scale(0.98);
        }

        /* เอฟเฟกต์กระพริบเมื่อหมดเวลา */
        .blink {
            animation: blinker 1s linear infinite;
            color: #ef4444 !important; /* สีแดงเมื่อหมดเวลา */
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- ส่วนแสดงเวลา (จะโชว์ตลอด) -->
    <div id="timer-display" title="คลิกเพื่อเริ่ม/หยุดชั่วคราว">00:00</div>

    <!-- แผงควบคุม (Downbar ติดขอบล่างถาวร) -->
    <div id="settings-panel" class="fixed bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-md border-t border-slate-700 px-6 py-4 flex flex-wrap justify-center items-center gap-4 md:gap-8 z-50 text-white shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
        
        <!-- ส่วนตั้งเวลา -->
        <div class="flex items-center gap-2">
            <label class="text-sm text-slate-400 font-bold mr-1">ตั้งเวลา:</label>
            <input type="number" id="input-minutes" min="0" max="999" value="5" class="w-16 bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-center text-lg focus:outline-none focus:border-blue-500" title="นาที">
            <span class="text-slate-400 font-bold">:</span>
            <input type="number" id="input-seconds" min="0" max="59" value="0" class="w-16 bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-center text-lg focus:outline-none focus:border-blue-500" title="วินาที">
        </div>

        <!-- ส่วนสีและขนาด -->
        <div class="flex items-center gap-4 border-l border-slate-700 pl-4 md:pl-8">
            <div class="flex items-center gap-2">
                <label class="text-sm text-slate-400 font-bold">สี:</label>
                <input type="color" id="input-color" value="#ffffff" class="w-9 h-9 rounded cursor-pointer bg-slate-800 border border-slate-600 p-0.5" title="เปลี่ยนสีตัวเลข">
            </div>
            <div class="flex items-center gap-2 ml-2">
                <label class="text-sm text-slate-400 font-bold">ขนาด:</label>
                <input type="range" id="input-size" min="3" max="15" value="8" step="0.5" class="w-24 md:w-32 cursor-pointer accent-blue-500" title="ปรับขนาดตัวเลข">
            </div>
        </div>

        <!-- ส่วนปุ่มควบคุม -->
        <div class="flex items-center gap-2 border-l border-slate-700 pl-4 md:pl-8">
            <button id="btn-start" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-8 rounded transition-colors shadow-lg">
                เริ่ม
            </button>
            <button id="btn-reset" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-6 rounded transition-colors shadow-lg">
                รีเซ็ต
            </button>
            <button id="btn-hide" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 px-6 rounded border border-slate-600 transition-colors ml-2 shadow-lg" title="ซ่อนทุกอย่าง">
                🙈 ซ่อนจอ
            </button>
        </div>
    </div>

    <script>
        // ตัวแปรต่างๆ
        let timerInterval;
        let totalSeconds = 0;
        let isRunning = false;

        // Elements
        const display = document.getElementById('timer-display');
        const settingsPanel = document.getElementById('settings-panel');
        const inputMinutes = document.getElementById('input-minutes');
        const inputSeconds = document.getElementById('input-seconds');
        const inputColor = document.getElementById('input-color');
        const inputSize = document.getElementById('input-size');
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        const btnHide = document.getElementById('btn-hide');

        // ฟังก์ชันแปลงวินาทีเป็นรูปแบบ MM:SS หรือ HH:MM:SS
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            
            if (h > 0) {
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // อัปเดตหน้าจอ
        function updateDisplay() {
            display.textContent = formatTime(totalSeconds);
            if (totalSeconds <= 0) {
                display.classList.add('blink');
            } else {
                display.classList.remove('blink');
                display.style.color = inputColor.value; // คืนค่าสีเดิมหากไม่ได้หมดเวลา
            }
        }

        // อ่านค่าจาก Input ไปยังตัวแปร
        function readInputs() {
            const m = parseInt(inputMinutes.value) || 0;
            const s = parseInt(inputSeconds.value) || 0;
            totalSeconds = (m * 60) + s;
            updateDisplay();
        }

        // เริ่ม/หยุด จับเวลา
        function toggleTimer() {
            if (isRunning) {
                // หยุดชั่วคราว
                clearInterval(timerInterval);
                isRunning = false;
                btnStart.textContent = "เริ่มทำต่อ";
                btnStart.classList.replace('bg-red-600', 'bg-blue-600');
                btnStart.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
            } else {
                // เริ่มจับเวลา
                if (totalSeconds <= 0) readInputs();
                if (totalSeconds <= 0) return; // ถ้าเวลายังเป็น 0 ไม่ต้องเริ่ม
                
                display.classList.remove('blink');
                display.style.color = inputColor.value;

                isRunning = true;
                btnStart.textContent = "หยุดชั่วคราว";
                btnStart.classList.replace('bg-blue-600', 'bg-red-600');
                btnStart.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');

                timerInterval = setInterval(() => {
                    totalSeconds--;
                    updateDisplay();
                    if (totalSeconds <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btnStart.textContent = "เริ่ม";
                        btnStart.classList.replace('bg-red-600', 'bg-blue-600');
                        btnStart.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
                    }
                }, 1000);
            }
        }

        // รีเซ็ตเวลา
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            display.classList.remove('blink');
            readInputs();
            btnStart.textContent = "เริ่ม";
            btnStart.classList.replace('bg-red-600', 'bg-blue-600');
            btnStart.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
        }

        // Event Listeners สำหรับปุ่ม
        btnStart.addEventListener('click', toggleTimer);
        btnReset.addEventListener('click', resetTimer);

        // ระบบซ่อนทุกอย่าง (กดแล้วหายวับไปเลย)
        btnHide.addEventListener('click', () => {
            display.style.display = 'none';
            settingsPanel.style.display = 'none';
        });

        // ระบบเรียกทุกอย่างกลับมา (ด้วยการดับเบิ้ลคลิกจอ)
        function unhideAll() {
            if (display.style.display === 'none' || settingsPanel.style.display === 'none') {
                display.style.display = '';
                settingsPanel.style.display = 'flex'; // แสดงกลับมาในรูปแบบ flex layout
            }
        }

        document.body.addEventListener('dblclick', unhideAll);

        // อัปเดตเมื่อมีการพิมพ์แก้เวลา
        inputMinutes.addEventListener('input', readInputs);
        inputSeconds.addEventListener('input', readInputs);

        // อัปเดตสีและขนาดแบบ Real-time
        inputColor.addEventListener('input', (e) => {
            if(!display.classList.contains('blink')) {
                display.style.color = e.target.value;
            }
        });
        
        inputSize.addEventListener('input', (e) => {
            display.style.fontSize = `${e.target.value}rem`;
        });

        // Event สำหรับตัวหนังสือ (หยุดชั่วคราว)
        display.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (totalSeconds > 0) {
                toggleTimer();
            }
        });

        // ป้องกันไม่ให้การดับเบิ้ลคลิกตัวหนังสือไปกวนการทำงานอื่นๆ
        display.addEventListener('dblclick', (e) => {
            e.stopPropagation();
        });

        // ==========================================
        // ระบบอ่านค่าจาก URL Parameters
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const urlM = urlParams.get('m');
        const urlS = urlParams.get('s');
        const urlAuto = urlParams.get('auto');

        // ถ้ามีการส่งค่า m หรือ s มาทาง URL ให้ตั้งค่าตามนั้น
        if (urlM !== null) inputMinutes.value = urlM;
        if (urlS !== null) inputSeconds.value = urlS;

        // โหลดค่าเริ่มต้น
        readInputs();
        display.style.color = inputColor.value;
        display.style.fontSize = `${inputSize.value}rem`;

        // ถ้ามีคำสั่ง auto=1 ใน URL ให้เริ่มจับเวลาทันที
        if (urlAuto === '1' || urlAuto === 'true') {
            toggleTimer();
        }

    </script>
</body>
</html>
